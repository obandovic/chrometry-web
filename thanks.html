<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks — Chrometry</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --accent: #0a84ff;
    --card: #f5f5f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --text: #f5f5f7;
      --muted: #98989d;
      --accent: #409cff;
      --card: #1c1c1e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    text-align: center;
    max-width: 420px;
    padding: 48px 24px;
  }
  img.logo {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    margin-bottom: 24px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 100px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/logo.png" alt="Chrometry">
    <h1>You're on the list</h1>
    <p>Thanks for your interest in Chrometry. We'll reach out at the email you gave us when early access opens up.</p>
    <a class="btn" href="/">Back to Chrometry</a>
  </div>
</body>
</html>
